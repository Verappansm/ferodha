server:
  port: 8080

spring:
  application:
    name: trade-api

  datasource:
    # Every value that differs between a laptop and a container comes from
    # the environment - nothing here is a real host, credential or secret.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# JWT_SECRET is read from the environment at runtime and appears in no
# committed file - see com.trade.security.JwtService, which fails fast at
# startup if this resolves to nothing.
app:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    com.trade: INFO

# /actuator/health only - not the full actuator surface. Its DataSource and
# Liquibase indicators are what let the container's HEALTHCHECK (and
# docker-compose's healthcheck for depends_on) mean "the database is
# actually reachable and migrated", not just "the JVM started".
management:
  endpoints:
    web:
      exposure:
        include: health
