openapi: 3.1.0

info:
  title: Automated Strategies API
  version: 1.0.0
  summary: A customer's automated trading rules (Sprint 10 stretch, B27).
  description: |
    Served by the Trade REST API (`com.trade.strategy`) behind the same JWT verification as every
    other `/api/v1/**` route. The Angular UI generates its typed client from this file.

    A strategy places an order for the customer when the price reaches its level, with a 60-second
    delegated token (decision log 0001) and within its limits (0002). A new strategy starts
    `DISABLED`. A running one cannot be edited (`STR-409`); disable it first. Another customer's
    strategy answers `STR-404`.
  contact:
    name: Team 2

servers:
  - url: http://localhost:8080

security:
  - bearerAuth: []

tags:
  - name: Strategies

paths:
  /api/v1/strategies:
    get:
      tags: [Strategies]
      operationId: getStrategies
      summary: Every strategy of the customer's account
      responses:
        '200':
          description: The strategies, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StrategyResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
    post:
      tags: [Strategies]
      operationId: createStrategy
      summary: Create a strategy (DISABLED until enabled)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStrategyRequest' }
      responses:
        '201':
          description: The new strategy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }

  /api/v1/strategies/{id}:
    parameters:
      - $ref: '#/components/parameters/StrategyId'
    get:
      tags: [Strategies]
      operationId: getStrategy
      summary: One strategy
      responses:
        '200':
          description: The strategy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Strategies]
      operationId: updateStrategy
      summary: Rewrite a strategy that is not running (disabled or stopped)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStrategyRequest' }
      responses:
        '200':
          description: The strategy as it now is.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidInput' }

  /api/v1/strategies/{id}/events:
    parameters:
      - $ref: '#/components/parameters/StrategyId'
    get:
      tags: [Strategies]
      operationId: getStrategyEvents
      summary: What the strategy did, newest first
      responses:
        '200':
          description: The events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StrategyEventResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/strategies/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/StrategyId'
    post:
      tags: [Strategies]
      operationId: enableStrategy
      summary: Start (or restart) the strategy
      responses:
        '200':
          description: The strategy, ENABLED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/strategies/{id}/disable:
    parameters:
      - $ref: '#/components/parameters/StrategyId'
    post:
      tags: [Strategies]
      operationId: disableStrategy
      summary: Stop the strategy at once and cancel its working orders
      responses:
        '200':
          description: The strategy, DISABLED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StrategyResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    StrategyId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorised:
      description: Missing, malformed, expired or wrongly signed token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: No such strategy for this account (STR-404), or the symbol is not tradable (INS-404).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: The strategy's state does not allow this (STR-409).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidInput:
      description: A field is not acceptable (VAL-422).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [errorCode, message]
      properties:
        errorCode:
          type: string
          enum: [STR-404, STR-409, INS-404, VAL-422, AUTH-401]
        message:
          type: string

    StrategySide:
      type: string
      enum: [BUY, SELL]

    StrategyStatus:
      type: string
      enum: [DISABLED, ENABLED, TRIPPED, COMPLETED, EXPIRED]

    CreateStrategyRequest:
      type: object
      required: [name, symbol, side, triggerPrice, quantity]
      description: A BUY needs both caps; a SELL ignores them (it only sells units already held).
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        symbol: { type: string, minLength: 1, maxLength: 20 }
        side: { $ref: '#/components/schemas/StrategySide' }
        triggerPrice: { type: number, format: double, exclusiveMinimum: 0 }
        quantity: { type: integer, format: int32, minimum: 1 }
        maxSpend: { type: [number, 'null'], format: double }
        maxPosition: { type: [integer, 'null'], format: int32 }
        maxOrders: { type: [integer, 'null'], format: int32, minimum: 1, maximum: 100 }
        maxFailures: { type: [integer, 'null'], format: int32, minimum: 1, maximum: 20 }
        dryRun: { type: [boolean, 'null'] }
        expiresAt: { type: [string, 'null'], format: date-time }

    StrategyResponse:
      type: object
      required: [strategyId, name, symbol, side, triggerPrice, quantity, maxOrders, maxFailures,
                 dryRun, status, ordersPlaced, consecutiveFailures, createdAt]
      properties:
        strategyId: { type: string, format: uuid }
        name: { type: string }
        symbol: { type: string }
        side: { $ref: '#/components/schemas/StrategySide' }
        triggerPrice: { type: number, format: double }
        quantity: { type: integer, format: int32 }
        maxSpend: { type: [number, 'null'], format: double }
        maxPosition: { type: [integer, 'null'], format: int32 }
        maxOrders: { type: integer, format: int32 }
        maxFailures: { type: integer, format: int32 }
        dryRun: { type: boolean }
        status: { $ref: '#/components/schemas/StrategyStatus' }
        ordersPlaced: { type: integer, format: int32 }
        consecutiveFailures: { type: integer, format: int32 }
        expiresAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        lastPrice:
          type: [number, 'null']
          format: double
          description: The price it last watched (the ask for a BUY, the bid for a SELL).
        lastCheckedAt: { type: [string, 'null'], format: date-time }

    StrategyEventResponse:
      type: object
      required: [at, kind]
      properties:
        at: { type: string, format: date-time }
        kind: { type: string }
        detail: { type: [string, 'null'] }
