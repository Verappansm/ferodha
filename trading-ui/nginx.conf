# Serves the two single-page apps built by the Dockerfile. Each falls back to
# its own index.html, so a deep link or a refresh on a client-side route works.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects (/admin -> /admin/) keep the browser's own address: behind
    # CloudFront and the gateway, an absolute one would name the load balancer.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json image/x-icon;

    # Admin console (baseHref /admin/).
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Content-hashed build output (main-ABCD1234.js, chunk-..., styles-....css): a new
    # build gives new names, so a year's cache is safe. A missing one is a plain 404,
    # never index.html sent where a script was expected.
    location ~* "-[A-Z0-9]{8}\.(?:js|css|woff2?|ttf|png|jpe?g|svg)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Icons and the manifest keep their names from build to build: a day.
    location ~* \.(?:ico|png|svg)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    # nginx's type list has no .webmanifest; without this it goes out as text/plain.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=86400";
    }

    # Trading UI.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached: it names the hashed bundles of the
    # current build. The bundles themselves change name on every build.
    location ~ (^|/)index\.html$ {
        add_header Cache-Control "no-cache";
    }
}
