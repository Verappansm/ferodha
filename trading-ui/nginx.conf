# Serves the two single-page apps built by the Dockerfile. Each falls back to
# its own index.html, so a deep link or a refresh on a client-side route works.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects (/admin -> /admin/) keep the browser's own address: behind
    # CloudFront and the gateway, an absolute one would name the load balancer.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Admin console (baseHref /admin/).
    location = /admin {
        return 301 /admin/;
    }
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Trading UI.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must never be cached: it names the hashed bundles of the
    # current build. The bundles themselves change name on every build.
    location ~ (^|/)index\.html$ {
        add_header Cache-Control "no-cache";
    }
}