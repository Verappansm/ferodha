<div class="app-container">
  <a class="skip-link" href="#main" data-testid="skip-link">Skip to main content</a>
  <!-- The sign-in and create-account pages are full-screen; the bar appears once signed in. -->
  @if (session.isSignedIn()) {
  <header class="navbar">
    <a class="nav-brand" routerLink="/dashboard">
      <span class="brand-mark" aria-hidden="true">F</span>
      Ferodha
    </a>
    <nav aria-label="Main">
      <ul class="nav-links">
        <li><a routerLink="/dashboard" routerLinkActive="active">Dashboard</a></li>
        <li><a routerLink="/portfolio" routerLinkActive="active">Portfolio</a></li>
        <li><a routerLink="/instruments" routerLinkActive="active">Markets</a></li>
        <li><a routerLink="/orders" routerLinkActive="active">Orders</a></li>
        <li><a routerLink="/watchlist" routerLinkActive="active">Watchlist</a></li>
        <li><a routerLink="/strategies" routerLinkActive="active">Strategies</a></li>
        <li><a routerLink="/bank" routerLinkActive="active">Bank</a></li>
        <li><a routerLink="/help" routerLinkActive="active" data-testid="nav-help">Help</a></li>
      </ul>
    </nav>
    <div class="nav-actions">
      <button
        type="button"
        class="profile-icon nav-icon"
        data-testid="balance-visibility"
        (click)="preferences.toggleMasked()"
        [attr.aria-pressed]="preferences.masked()"
        [attr.aria-label]="preferences.masked() ? 'Show balances' : 'Hide balances'"
        [attr.title]="preferences.masked() ? 'Show balances' : 'Hide balances'"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
          <circle cx="12" cy="12" r="3" />
          @if (preferences.masked()) {
          <path d="M3 3l18 18" />
          }
        </svg>
      </button>
      <a
        routerLink="/settings"
        class="profile-icon nav-icon"
        title="Settings"
        aria-label="Settings"
        routerLinkActive="active"
        data-testid="nav-settings"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"
          />
        </svg>
      </a>
      <a
        routerLink="/profile"
        class="profile-icon"
        title="View Profile"
        aria-label="View your profile"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
      </a>
      <app-theme-toggle />
      <button type="button" class="sign-out" data-testid="sign-out" (click)="signOut()">
        Sign out
      </button>
    </div>
  </header>
  }

  <main class="main-content" id="main" tabindex="-1">
    <router-outlet></router-outlet>
  </main>
</div>
