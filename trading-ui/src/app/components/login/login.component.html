<div class="login-container">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <h1>Sign in</h1>

    <label for="username">Email</label>
    <input
      id="username"
      type="email"
      formControlName="username"
      autocomplete="username"
      data-testid="login-username"
      [attr.aria-invalid]="showError('username')"
      aria-describedby="username-error"
    />
    @if (showError('username')) {
      <p id="username-error" class="field-error" data-testid="login-username-error">
        @if (form.controls.username.hasError('required')) {
          Enter your email address.
        } @else {
          Enter a valid email address, such as name&#64;example.com.
        }
      </p>
    }

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      formControlName="password"
      autocomplete="current-password"
      data-testid="login-password"
      [attr.aria-invalid]="showError('password')"
      aria-describedby="password-error"
    />
    @if (showError('password')) {
      <p id="password-error" class="field-error" data-testid="login-password-error">
        Enter your password.
      </p>
    }

    @if (error()) {
      <p class="form-error" role="alert" data-testid="login-error">{{ error() }}</p>
    }

    <button type="submit" data-testid="login-submit" [disabled]="isLoading()">
      {{ isLoading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
