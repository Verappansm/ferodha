<div class="panel top-positions-panel">
  <div class="panel-header">
    <h2>Top Positions</h2>
  </div>
  <div class="panel-content" *ngIf="!loading; else loadingState">
    <div *ngIf="!error; else errorState">
      <div *ngIf="positions && positions.length > 0" class="positions-list">
        <div *ngFor="let pos of positions" class="position-item">
          <div class="position-symbol">{{ pos.symbol }}</div>
          <div class="position-qty">{{ pos.quantity }} @ {{ pos.lastPrice | number: "1.2-2" }}</div>
          <div class="position-value" [class.positive]="pos.unrealisedPnl > 0" [class.negative]="pos.unrealisedPnl < 0">
            {{ pos.marketValue | number: "1.2-2" }}
          </div>
        </div>
      </div>
      <div *ngIf="!positions || positions.length === 0" class="empty-message">
        No positions
      </div>
    </div>
    <ng-template #errorState>
      <div class="panel-error">
        <p class="error-message">{{ error }}</p>
        <button class="btn btn-outline" (click)="retryClick()">Try Again</button>
      </div>
    </ng-template>
  </div>
  <ng-template #loadingState>
    <div class="skeleton-loader">
      <div class="skeleton-bar"></div>
    </div>
  </ng-template>
</div>
