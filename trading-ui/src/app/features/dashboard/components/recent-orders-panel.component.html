<div class="panel recent-orders-panel">
  <div class="panel-header">
    <h2>Recent Orders</h2>
  </div>
  <div class="panel-content" *ngIf="!loading; else loadingState">
    <div *ngIf="!error; else errorState">
      <div *ngIf="orders && orders.length > 0" class="orders-list">
        <div *ngFor="let order of orders" class="order-item">
          <div class="order-symbol">{{ order.symbol }}</div>
          <div class="order-side" [class.buy]="order.side === 'BUY'" [class.sell]="order.side === 'SELL'">
            {{ order.side }}
          </div>
          <div class="order-quantity">{{ order.quantity }}</div>
          <div class="order-status">{{ order.status }}</div>
        </div>
      </div>
      <div *ngIf="!orders || orders.length === 0" class="empty-message">
        No recent orders
      </div>
    </div>
    <ng-template #errorState>
      <div class="panel-error">
        <p class="error-message">{{ error }}</p>
        <button class="btn btn-outline" (click)="retryClick()">Try Again</button>
      </div>
    </ng-template>
  </div>
  <ng-template #loadingState>
    <div class="skeleton-loader">
      <div class="skeleton-bar"></div>
    </div>
  </ng-template>
</div>
