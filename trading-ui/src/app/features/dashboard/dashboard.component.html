<div class="page">
  <header class="page-header">
    <div>
      <h1>Dashboard</h1>
      <p>
        Your cash, today's profit and loss, and what you hold.
        @if (lastUpdated(); as updated) {
          <span class="updated" data-testid="dashboard-updated"
            >Updated {{ updated | date: 'shortTime' }}</span
          >
        }
      </p>
    </div>
    <div class="page-actions">
      <button
        type="button"
        class="btn btn-secondary"
        data-testid="dashboard-refresh"
        (click)="refresh()"
      >
        Refresh
      </button>
      <a class="btn btn-primary" routerLink="/instruments">Browse markets</a>
    </div>
  </header>

  <div class="dash-row">
    <app-cash-panel [state]="cash()" (retry)="loadCash()" />
    <app-pnl-panel [state]="pnl()" (retry)="loadPnl()" />
  </div>
  <div class="dash-row">
    <app-recent-orders-panel [state]="orders()" (retry)="loadOrders()" />
    <app-top-positions-panel [state]="positions()" (retry)="loadPositions()" />
  </div>
</div>
