<section class="dashboard">
  <header class="dashboard-header">
    <div>
      <h2>Dashboard</h2>
      @if (lastUpdated(); as updated) {
        <p class="updated" data-testid="dashboard-updated">
          Updated {{ updated | date: 'shortTime' }}
        </p>
      }
    </div>
    <button type="button" class="refresh" data-testid="dashboard-refresh" (click)="refresh()">
      Refresh
    </button>
  </header>

  <div class="grid">
    <app-cash-panel [state]="cash()" (retry)="loadCash()" />
    <app-pnl-panel [state]="pnl()" (retry)="loadPnl()" />
    <app-recent-orders-panel [state]="orders()" (retry)="loadOrders()" />
    <app-top-positions-panel [state]="positions()" (retry)="loadPositions()" />
  </div>
</section>
