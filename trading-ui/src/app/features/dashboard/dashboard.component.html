<div class="dashboard-container" *ngIf="accountId() as acctId">
  <div class="dashboard-header">
    <h1>Portfolio Dashboard</h1>
    <p class="last-update" *ngIf="lastUpdate()">
      Last updated: {{ lastUpdate() | date: "short" }}
    </p>
  </div>

  <div class="dashboard-grid">
    <!-- Cash Balance Panel -->
    <div class="panel-wrapper">
      <app-cash-panel
        [accountId]="acctId"
        [loading]="cashLoading()"
        [error]="cashError()"
        [cashBalance]="cashBalance()"
        (retry)="reloadCash()">
      </app-cash-panel>
    </div>

    <!-- P&L Panel -->
    <div class="panel-wrapper">
      <app-pnl-panel
        [accountId]="acctId"
        [loading]="pnlLoading()"
        [error]="pnlError()"
        [pnlData]="pnlData()"
        (retry)="reloadPnl()">
      </app-pnl-panel>
    </div>

    <!-- Recent Orders Panel -->
    <div class="panel-wrapper">
      <app-recent-orders-panel
        [accountId]="acctId"
        [loading]="ordersLoading()"
        [error]="ordersError()"
        [orders]="orders()"
        (retry)="reloadOrders()">
      </app-recent-orders-panel>
    </div>

    <!-- Top Positions Panel -->
    <div class="panel-wrapper">
      <app-top-positions-panel
        [accountId]="acctId"
        [loading]="positionsLoading()"
        [error]="positionsError()"
        [positions]="positions()"
        (retry)="reloadPositions()">
      </app-top-positions-panel>
    </div>
  </div>

  <!-- No Data State -->
  <div class="empty-state" *ngIf="isEmptyState()">
    <div class="empty-state-content">
      <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
      </svg>
      <h2>Welcome to Your Dashboard</h2>
      <p>All your portfolio data will appear here once loaded</p>
    </div>
  </div>
</div>
