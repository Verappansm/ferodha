<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ferodha</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- Applies a saved light/dark choice before the app starts, so the page never flashes the wrong theme. -->
    <script>
      try {
        var t = localStorage.getItem('ferodha.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
