<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ferodha Operations</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- An internal tool: never indexed. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Ferodha operations console: account requests, users, fees, orders and system health."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Applies a saved light/dark choice before the console starts, so it never flashes the wrong theme. -->
    <script>
      try {
        var t = localStorage.getItem('ferodha-ops.theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <adm-root></adm-root>
  </body>
</html>
