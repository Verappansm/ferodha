# The one public entry point: ONE load balancer, ONE hostname, three ports.
#
# The UI works out the API addresses in the browser (trading-ui/src/environments):
# the page's own hostname on :3000 (auth) and :8081 (trade API). So the page and both
# APIs must answer on the same hostname. Separate load balancers per service (their
# four-lb overlay) give three hostnames and break that; this gateway keeps one:
#   http://<lb>:4200 -> trading-ui    http://<lb>:3000 -> auth-service
#   http://<lb>:8081 -> trade-api
# CORS_ALLOWED_ORIGINS (config.env) is therefore http://<lb>:4200.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-nginx
data:
  default.conf: |
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 10m;

    server {
      listen 4200;
      location / { proxy_pass http://trading-ui:80; }
    }
    server {
      listen 3000;
      location / { proxy_pass http://auth-service:3000; }
    }
    server {
      listen 8081;
      location / { proxy_pass http://trade-api:8081; }
    }
    # The gateway's own health check, for the probes below.
    server {
      listen 8080;
      location = /healthz { return 200 "ok\n"; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        # Bump this when default.conf changes, so the pod restarts and reloads it.
        config-version: "1"
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - { name: ui, containerPort: 4200 }
            - { name: auth, containerPort: 3000 }
            - { name: api, containerPort: 8081 }
            - { name: health, containerPort: 8080 }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d }
          readinessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            periodSeconds: 20
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: conf
          configMap: { name: gateway-nginx }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "300"
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports:
    - { name: ui, port: 4200, targetPort: ui }
    - { name: auth, port: 3000, targetPort: auth }
    - { name: api, port: 8081, targetPort: api }
