# Encrypted EBS gp3 disks for Kafka. Needs the aws-ebs-csi-driver addon (cluster.example.yaml).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
provisioner: ebs.csi.aws.com
parameters:
  type: gp3
  encrypted: "true"
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
