services:

  postgres:
    image: postgres:16-alpine
    container_name: trade-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}
      POSTGRES_USER: ${POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trade}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Postgres only runs files under docker-entrypoint-initdb.d once, on a
      # brand-new (empty) data volume, in lexical filename order - hence the
      # 01-/02- renames on the mount target. To re-seed from scratch, stop
      # the stack and remove the postgres-data volume first.
      - ./database/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds/001_seed_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trade} -d ${POSTGRES_DB:-tradedb}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - trade-net

  kafka:
    # Pinned to the version infra/README.md names (Kafka 3.8, KRaft), so a
    # rebuild months later gets the same broker.
    image: apache/kafka:3.8.1
    container_name: trade-kafka
    # Only the external/host listener is published - other containers on
    # trade-net never go through the host port mapping, they use the
    # internal listener (kafka:29092) directly over the compose network.
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners: PLAINTEXT (29092) for container-to-container traffic
      # inside this compose network, PLAINTEXT_HOST (9092) for anything on
      # the host itself (a local kafka-topics.sh, a debugging script, etc).
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Auto-creation is off deliberately (Story 1): the topics are created
      # explicitly, by the kafka-init service below on every `up` (the same
      # topics and settings as kafka_pipeline/create_topics.sh and
      # create_dlt_topics.sh, which still work against this container).
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - trade-net

  # One-shot: creates the six topics once the broker is healthy, then exits.
  # Idempotent (--if-not-exists), so every `up` runs it safely; the services
  # that produce or consume wait for it to finish.
  kafka-init:
    image: apache/kafka:3.8.1
    container_name: trade-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        topic() {
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$1" --partitions "$$2" --replication-factor 1 $${3:+--config retention.ms=$$3}
        }
        topic orders 3 604800000
        topic trade-events 3 2592000000
        topic market-data 6 86400000
        topic orders.DLT 1
        topic trade-events.DLT 1
        topic market-data.DLT 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --list
    restart: "no"
    networks:
      - trade-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: trade-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - trade-net

  trade-api:
    container_name: trade-api
    build:
      context: ./trade_api
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}
      POSTGRES_USER: ${POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trade}
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-signing-secret-please-change-later}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      # The browser origin of the UI (which also serves /admin). On EC2:
      # http://<public host>:4200.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Outgoing mail (sign-up codes from auth-service, EMAIL notifications from
      # trade-api). SMTP_HOST empty: nothing is sent; sign-up codes go to the
      # auth-service log. Port and sender keep their defaults when unset,
      # because an empty value fails both services' validation.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-Ferodha <no-reply@ferodha.local>}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - trade-net

  # NestJS auth service. Issues the HS256 access tokens trade-api verifies
  # (same JWT_SECRET, iss=auth-service). Waits for trade-api, not just
  # postgres: it links users to Accounts.id, which trade-api's Liquibase adds.
  auth-service:
    container_name: auth-service
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-signing-secret-please-change-later}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}
      POSTGRES_USER: ${POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trade}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200}
      # Outgoing mail (sign-up codes from auth-service, EMAIL notifications from
      # trade-api). SMTP_HOST empty: nothing is sent; sign-up codes go to the
      # auth-service log. Port and sender keep their defaults when unset,
      # because an empty value fails both services' validation.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: "${MAIL_FROM:-Ferodha <no-reply@ferodha.local>}"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5
    depends_on:
      trade-api:
        condition: service_healthy
    networks:
      - trade-net

  trade-executor:
    container_name: trade-executor
    build:
      context: ./trade_executor
      dockerfile: Dockerfile
    # 8082 to match the reference architecture (leap-architecture.pages.dev).
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tradedb}
      POSTGRES_USER: ${POSTGRES_USER:-trade}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trade}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FAUXNANCE_API_URL: ${FAUXNANCE_API_URL}
      FAUXNANCE_API_KEY: ${FAUXNANCE_API_KEY}
      # The executor's own price feed (com.trade.executor.ticker, formerly the
      # pricing-generator service) runs under every profile: real Fauxnance
      # quotes every 5 minutes as anchors, a simulated tick for every tradable
      # instrument to market-data every 5 seconds, 1-minute bars for the 1D
      # chart (market_bars) and daily candles (market_candles). Under
      # market-sim its market maker (formerly trades-generator) also places
      # synthetic counter-orders. The old market-data poller stays off;
      # POLL_INTERVAL_SECONDS only applies if it is switched back on.
      GENERATOR_BAR_RETENTION_HOURS: ${GENERATOR_BAR_RETENTION_HOURS:-26}
      EXECUTOR_MARKET_DATA_POLLER_ENABLED: ${EXECUTOR_MARKET_DATA_POLLER_ENABLED:-false}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-60}
      # Fills are priced at that live tick, in process, under every profile:
      # a BUY at the ask, a SELL at the bid. The
      # profile only changes how orders settle. Empty/unset = fill-or-reject
      # against that tick, no partial fills. market-sim = an order book at the
      # same prices, with partial fills and expiry. fauxnance-direct = the
      # retired one-Fauxnance-quote-per-order path (needs the FAUXNANCE_* keys).
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 5
    # trade_executor has no Liquibase of its own - trade-api's changelog is
    # what adds the Sprint 7 settlement columns this service writes to, so
    # it must never start before trade-api's healthcheck passes.
    depends_on:
      trade-api:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    networks:
      - trade-net

networks:
  trade-net:
    name: trade-net

volumes:
  postgres-data:
