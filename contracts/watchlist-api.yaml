openapi: 3.1.0

info:
  title: Watchlists and Price Alerts API
  version: 1.0.0
  summary: A customer's watchlists, the instruments on them, and a price alert per instrument (LEAP-007).
  description: |
    Served by the Trade REST API (`com.trade.watchlist`) on the same port, behind the same JWT
    verification as every other `/api/v1/**` route. The Angular UI generates its typed client from
    this file.

    ## Scoping

    A watchlist belongs to the user named by the token's `sub`. Another user's watchlist or item
    answers `WL-404`, exactly as one that does not exist.

    ## Price alerts

    One alert per watchlist item: a threshold (a price above zero with at most two decimals) and a
    direction. Setting it arms it (`ACTIVE`). The module's own `market-data` consumer checks each
    quote against the active alerts on its symbol; the first quote that reaches the threshold moves
    the alert to `TRIGGERED` with a guarded update, so it fires once, and hands it to the
    notifications module, which delivers it on the channel in the customer's Settings. Cancelling
    keeps the threshold readable as `CANCELLED`; a cancelled alert is never evaluated again.
    Setting a threshold again re-arms the alert, which may then fire again.
  contact:
    name: Team 2

servers:
  - url: http://localhost:8081

security:
  - bearerAuth: []

tags:
  - name: Watchlists
    description: Lists and the instruments on them.
  - name: PriceAlerts
    description: The alert on one watchlist item.

paths:
  /api/v1/watchlists:
    get:
      tags: [Watchlists]
      operationId: getWatchlists
      summary: Every watchlist of the user, with its items
      responses:
        '200':
          description: The watchlists, in display order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WatchlistResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
    post:
      tags: [Watchlists]
      operationId: createWatchlist
      summary: Create a watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWatchlistRequest' }
      responses:
        '200':
          description: The new, empty watchlist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchlistResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/InvalidInput' }

  /api/v1/watchlists/{watchlistId}:
    parameters:
      - $ref: '#/components/parameters/WatchlistId'
    get:
      tags: [Watchlists]
      operationId: getWatchlist
      summary: One watchlist, with its items
      responses:
        '200':
          description: The watchlist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchlistResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Watchlists]
      operationId: updateWatchlist
      summary: Rename a watchlist or move it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateWatchlistRequest' }
      responses:
        '200':
          description: The watchlist as it now is.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchlistResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Watchlists]
      operationId: deleteWatchlist
      summary: Delete a watchlist and its items
      responses:
        '200': { description: Deleted. }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/watchlists/{watchlistId}/items:
    parameters:
      - $ref: '#/components/parameters/WatchlistId'
    get:
      tags: [Watchlists]
      operationId: getWatchlistItems
      summary: The items of a watchlist, in display order
      responses:
        '200':
          description: The items.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WatchlistItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Watchlists]
      operationId: addWatchlistItem
      summary: Add a tradable instrument to the watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddWatchlistItemRequest' }
      responses:
        '200':
          description: The new item.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WatchlistItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/v1/watchlists/items/bulk:
    post:
      tags: [Watchlists]
      operationId: addWatchlistItemsBulk
      summary: Add one instrument to several watchlists
      description: Lists that already hold the instrument, or are not the user's, are skipped.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkAddWatchlistItemsRequest' }
      responses:
        '200':
          description: The items that were added.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WatchlistItemResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }

  /api/v1/watchlists/{watchlistId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/WatchlistId'
      - $ref: '#/components/parameters/ItemId'
    delete:
      tags: [Watchlists]
      operationId: removeWatchlistItem
      summary: Remove an instrument from the watchlist
      responses:
        '200': { description: Removed. }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/watchlists/{watchlistId}/items/reorder:
    parameters:
      - $ref: '#/components/parameters/WatchlistId'
    patch:
      tags: [Watchlists]
      operationId: reorderWatchlistItems
      summary: Set the display order of the items
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderWatchlistItemsRequest' }
      responses:
        '200': { description: Reordered. }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/watchlists/{watchlistId}/items/{itemId}/alert:
    parameters:
      - $ref: '#/components/parameters/WatchlistId'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [PriceAlerts]
      operationId: createPriceAlert
      summary: Set the item's alert and arm it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePriceAlertRequest' }
      responses:
        '200':
          description: The alert, ACTIVE.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceAlertResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }
    patch:
      tags: [PriceAlerts]
      operationId: updatePriceAlert
      summary: Change the threshold (re-arms the alert), or send both fields null to cancel it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePriceAlertRequest' }
      responses:
        '200':
          description: The alert as it now is.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PriceAlertResponse' }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/InvalidInput' }
    delete:
      tags: [PriceAlerts]
      operationId: deletePriceAlert
      summary: Cancel the item's alert (it stays readable as CANCELLED)
      responses:
        '200': { description: Cancelled. }
        '401': { $ref: '#/components/responses/Unauthorised' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    WatchlistId:
      name: watchlistId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorised:
      description: Missing, malformed, expired or wrongly signed token.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: No such watchlist or item for this user (WL-404).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    Conflict:
      description: A watchlist with this name, or this instrument on this list, already exists (WL-409).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    InvalidInput:
      description: A field is not acceptable (VAL-422).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      required: [errorCode, message]
      properties:
        errorCode:
          type: string
          enum: [WL-404, WL-409, INS-404, VAL-422, AUTH-401]
        message:
          type: string

    AlertDirection:
      type: string
      enum: [ABOVE, BELOW]

    AlertStatus:
      type: string
      enum: [ACTIVE, TRIGGERED, CANCELLED]
      description: |
        `ACTIVE` until a quote reaches the threshold, then `TRIGGERED` (once). `CANCELLED` by the
        customer. Null on an item whose alert was never set.

    WatchlistResponse:
      type: object
      required: [watchlistId, name, displayOrder, items]
      properties:
        watchlistId: { type: string, format: uuid }
        name: { type: string }
        displayOrder: { type: integer, format: int32 }
        items:
          type: array
          items: { $ref: '#/components/schemas/WatchlistItemResponse' }

    WatchlistItemResponse:
      type: object
      required: [itemId, instrumentId, symbol, name, exchange, currency, lastPrice, dayChange,
                 dayChangePercent, addedAt, displayOrder, intradayData]
      properties:
        itemId: { type: string, format: uuid }
        instrumentId: { type: string, format: uuid }
        symbol: { type: string }
        name: { type: string }
        exchange: { type: string }
        currency: { type: string }
        sector: { type: [string, 'null'] }
        lastPrice:
          type: number
          format: double
          description: The latest price, 0 when none is known yet.
        dayChange:
          type: number
          format: double
          description: The move from the previous close, 0 when either is unknown.
        dayChangePercent: { type: number, format: double }
        lastUpdated: { type: [string, 'null'], format: date-time }
        addedAt: { type: string, format: date-time }
        displayOrder: { type: integer, format: int32 }
        intradayData:
          type: array
          items: { $ref: '#/components/schemas/IntradayPricePoint' }
        alertPrice: { type: [number, 'null'], format: double }
        alertDirection:
          oneOf:
            - $ref: '#/components/schemas/AlertDirection'
            - type: 'null'
        alertStatus:
          oneOf:
            - $ref: '#/components/schemas/AlertStatus'
            - type: 'null'
        alertTriggeredAt: { type: [string, 'null'], format: date-time }
        alertTriggeredPrice: { type: [number, 'null'], format: double }

    IntradayPricePoint:
      type: object
      required: [timestamp, price]
      properties:
        timestamp: { type: string, format: date-time }
        price: { type: number, format: double }

    CreateWatchlistRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }

    UpdateWatchlistRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        displayOrder: { type: integer, format: int32 }

    AddWatchlistItemRequest:
      type: object
      required: [symbol, watchlistId]
      properties:
        symbol: { type: string, maxLength: 20 }
        watchlistId: { type: string, format: uuid }

    BulkAddWatchlistItemsRequest:
      type: object
      required: [symbol, watchlistIds]
      properties:
        symbol: { type: string, maxLength: 20 }
        watchlistIds:
          type: array
          items: { type: string, format: uuid }

    ReorderWatchlistItemsRequest:
      type: object
      required: [itemOrderMap]
      properties:
        itemOrderMap:
          type: object
          description: Item id to its new display order.
          additionalProperties: { type: integer, format: int32 }

    CreatePriceAlertRequest:
      type: object
      required: [itemId, alertPrice, alertDirection]
      properties:
        itemId: { type: string, format: uuid }
        alertPrice:
          type: number
          format: double
          exclusiveMinimum: 0
          multipleOf: 0.01
        alertDirection: { $ref: '#/components/schemas/AlertDirection' }

    UpdatePriceAlertRequest:
      type: object
      description: Both set re-arms the alert at the new threshold; both null cancels it.
      properties:
        alertPrice:
          type: [number, 'null']
          format: double
        alertDirection:
          oneOf:
            - $ref: '#/components/schemas/AlertDirection'
            - type: 'null'

    PriceAlertResponse:
      type: object
      required: [itemId, symbol, name]
      properties:
        itemId: { type: string, format: uuid }
        symbol: { type: string }
        name: { type: string }
        alertPrice: { type: [number, 'null'], format: double }
        alertDirection:
          oneOf:
            - $ref: '#/components/schemas/AlertDirection'
            - type: 'null'
        alertStatus:
          oneOf:
            - $ref: '#/components/schemas/AlertStatus'
            - type: 'null'
        alertTriggeredAt: { type: [string, 'null'], format: date-time }
        alertTriggeredPrice: { type: [number, 'null'], format: double }
