# Layered on top of application.yml when SPRING_PROFILES_ACTIVE includes
# "windows": this service runs natively on Windows and the Kafka broker runs
# in Docker on a separate Linux host - see windows/windows-setup.md. Combine with
# market-sim as SPRING_PROFILES_ACTIVE=windows,market-sim.
#
# KAFKA_BOOTSTRAP_SERVERS has no default here on purpose - see trade_api's
# application-windows.yml.
server:
  port: ${SERVER_PORT:8082}

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      properties:
        max.block.ms: ${KAFKA_MAX_BLOCK_MS:10000}

# No compose DNS on Windows: trades-generator is a sibling process on this
# same machine.
trades-generator:
  base-url: ${TRADES_GENERATOR_URL:http://localhost:8083}

# A variable can't be set to an empty string on Windows (setting "" deletes
# it), so a blank FAUXNANCE_* in windows/.env.windows arrives here as unset.
# The URL defaults to a closed local port rather than "": an empty base URL
# makes every request a relative URI, which fails with an exception the
# quote client doesn't treat as a fetch failure (the order would stay NEW and
# end up on orders.DLT). Connection refused is a normal fetch failure, so
# without Fauxnance configured orders resolve to REJECTED/PRICE_UNAVAILABLE.
fauxnance:
  base-url: ${FAUXNANCE_API_URL:http://127.0.0.1:9}
  api-key: ${FAUXNANCE_API_KEY:}
